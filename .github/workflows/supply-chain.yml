# Cadena de suministro (tarea 9). La lógica vive en poc-almagentic-core.
#   PR   → construye la imagen, la prueba arrancada y genera el SBOM (solo lectura).
#   main → además la sube a GHCR, la firma con cosign y adjunta las atestaciones
#          de procedencia SLSA y de SBOM.
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  # Relanzar publicación y promoción desde main (Actions → supply-chain → Run workflow).
  # Un Re-run repite la versión de core de la ejecución original; esto usa la actual.
  workflow_dispatch:

permissions: {}

jobs:
  image:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-supply-chain.yml@v1
    with:
      publish: false

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: supply-chain-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-supply-chain.yml@v1
    with:
      publish: true

  # Tarea 10: con la imagen publicada y firmada, el promotor propone el despliegue en gitops.
  # La clave del promotor está en el entorno gitops-staging, que solo admite la rama main.
  # No se pasan secretos: el job de core declara ese entorno y lee la clave de ahí.
  promote:
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-promote.yml@v1
    with:
      image: ghcr.io/acbacb77/poc-almagentic-app
      digest: ${{ needs.release.outputs.digest }}
      promoter-app-id: "5179780"
