# Entrada de demanda (tarea A): cada petición nueva pasa por el agente de triage.
# La lógica vive en poc-almagentic-core; aquí solo se decide cuándo llamarla.
name: triage

on:
  issues:
    types: [opened, reopened, labeled]

permissions: {}

jobs:
  triage:
    # Solo peticiones de personas con acceso al repo, o si un responsable
    # pide repetirlo con la etiqueta triage:repetir. El resto, triage manual.
    if: >-
      (github.event.action != 'labeled' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event.action == 'labeled' && github.event.label.name == 'triage:repetir')
    # A nivel de job: los eventos que no lanzan triage no cancelan uno en marcha.
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-triage.yml@v1
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  external:
    # Peticiones de personas sin acceso: no gastan la suscripción ni las lee un modelo.
    if: >-
      github.event.action != 'labeled' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create "triage:manual" --repo "$REPO" --color e99695 --description "Requiere triage humano" --force
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "triage:manual"
